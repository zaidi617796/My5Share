plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mobilesettingsguide.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mobilesettingsguide.app'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

// Fix: kotlin-stdlib ke purane jdk7/jdk8 tukre (1.6.21) naye stdlib (1.8.22)
// se takrate hain — duplicate class error. Purane wale nikalo; unka content
// naye stdlib me pehle se maujood hai.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
