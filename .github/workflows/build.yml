name: Build SettingsGuide APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsGuide-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    # Play Store ke liye signed AAB. Sirf tab chalta hai jab GitHub Secrets me
    # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD set hon.
    if: secrets.KEYSTORE_BASE64 != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Build signed Release AAB
        run: gradle bundleRelease --no-daemon
          -Pandroid.injected.signing.store.file=/tmp/release.keystore
          -Pandroid.injected.signing.store.password='${{ secrets.KEYSTORE_PASSWORD }}'
          -Pandroid.injected.signing.key.alias='${{ secrets.KEY_ALIAS }}'
          -Pandroid.injected.signing.key.password='${{ secrets.KEY_PASSWORD }}'

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SettingsGuide-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
